<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->
    <title>All Articles - <!-- SITE_TITLE --></title>
    <!-- ALL_SEO_HEAD -->
    <!-- INCLUDE:home-layout-style -->
    <style>
        .freecat-all-page .layout-container {
            padding: calc(var(--freecat-page-top-offset) + 1.25rem) var(--freecat-all-content-inset) 5rem;
        }

        .freecat-all-page .layout-content-container {
            max-width: 1560px;
            color: var(--freecat-home-text);
        }

        /* 三栏保持从左到右的阅读与排序顺序，封面随列宽等比缩放。 */
        .freecat-all-grid {
            --home-post-cover-columns: minmax(0, 1fr);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            column-gap: clamp(2rem, 4vw, 3.5rem);
            border-top: 1px solid var(--freecat-home-rule);
        }

        .freecat-all-grid .home-post-entry {
            --home-post-padding: 3rem;
            min-width: 0;
            align-content: start;
        }

        .freecat-all-grid .home-post-cover {
            grid-row: 1;
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 2;
            max-height: none;
        }

        /* 沿用首页字号与行距；短标题也预留两行，长标题使用原生省略号。 */
        .freecat-all-grid .home-post-title {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            height: 3em;
            overflow: hidden;
        }

        .freecat-all-grid .home-post-excerpt {
            height: 5.4em;
        }

        /* 无封面时用正文补充预览信息，保持八行行高与原生省略号。 */
        .freecat-all-grid .has-no-cover .home-post-excerpt {
            -webkit-line-clamp: 8;
            height: 14.4em;
        }

        .freecat-all-page .freecat-home-list-heading {
            flex-wrap: wrap;
            row-gap: 1rem;
            padding-block: 0.75rem 1.5rem;
        }

        @media (min-width: 760px) {
            .freecat-all-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1120px) {
            .freecat-all-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

    </style>
</head>

<body
    class="freecat-all-page bg-white dark:bg-background-dark font-display text-[#1e293b] dark:text-slate-200 transition-colors duration-200">
    <div class="freecat-home-stage relative flex h-auto min-h-screen w-full flex-col">

        <!-- INCLUDE:header -->

        <!-- 顶部留白沿用固定顶栏偏移，独立页面和外壳内的布局保持一致。 -->
        <main data-floating-nav-container
            class="layout-container page-blur-target flex h-full grow flex-col">
            <div class="layout-content-container relative flex flex-col flex-1 mx-auto w-full">

                <div data-all-toolbar
                    class="freecat-list-toolbar flex items-center justify-between gap-4 pb-4">
                    <a href="/" data-go-back
                        class="group inline-flex items-center gap-2 h-10 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 transition-colors duration-150">
                        <svg class="text-xl t-btn-arrow-prev"
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em"
                            height="1em">
                            <path
                                d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z">
                            </path>
                        </svg>
                        <span class="freecat-go-back-text text-sm">Back</span>
                    </a>
                </div>

                <div class="freecat-home-list-heading">
                    <h1>All posts <span class="freecat-home-count"><!-- ALL_POST_COUNT --></span></h1>
                    <!-- INCLUDE:update-sort-control -->
                </div>

                <!-- === 动态文章注入区（显示所有文章，无分页） === -->
                <div id="posts-list" class="freecat-all-grid">
                    <!-- ALL_POSTS_LIST_PLACEHOLDER -->
                </div>
                <!-- ===================== -->

            </div>
        </main>

        <!-- INCLUDE:floating-nav -->

        <!-- INCLUDE:footer -->
    </div>

    <!-- INCLUDE:scripts-end -->
</body>

</html>
