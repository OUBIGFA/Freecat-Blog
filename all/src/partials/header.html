<!-- 顶栏统一使用文字导航与轻量图标；搜索、标签、主题和音频保持原有入口。 -->
<header class="fixed top-0 left-0 w-full z-50 freecat-site-header">
    <div class="header-blur-target">
        <a class="freecat-header-brand" href="/" aria-label="<!-- SITE_NAME --> 首页">
            <span class="freecat-brand-text"><!-- SITE_NAME --></span>
        </a>
        <div class="freecat-header-actions">
            <nav id="nav-links" aria-label="主导航">
                <a class="freecat-nav-text freecat-nav-home" href="/">Home</a>
                <a class="freecat-nav-text" href="/all">Posts</a>
                <a class="freecat-nav-text" href="/about">About</a>
            </nav>
            <div class="freecat-header-tools">
                <!-- NAV_AUDIO_BUTTON -->
                <button class="freecat-header-action" id="search-toggle" type="button" aria-label="Search" title="搜索文章">
                    <!-- HEADER_SEARCH_ICON -->
                </button>
                <div class="relative">
                    <button class="freecat-header-action" id="tag-menu-toggle" type="button" aria-label="View tags" title="查看标签" aria-expanded="false" aria-controls="tag-menu">
                        <!-- HEADER_TAG_ICON -->
                    </button>
                    <div id="tag-menu" role="menu" aria-label="Tags" data-origin="top-right"
                        class="t-dropdown tag-menu-panel absolute left-1/2 top-[calc(100%+0.75rem)] z-50 rounded-md border border-slate-200 bg-white p-2 dark:border-slate-700 dark:bg-slate-900">
                        <div class="tag-menu-items max-h-[calc(100vh-7rem)] overflow-y-auto overscroll-contain pr-1" data-tag-menu-items>
                            <!-- TAG_MENU_ITEMS -->
                        </div>
                    </div>
                </div>
                <button class="freecat-header-action" id="theme-toggle" type="button" aria-label="Toggle theme" title="切换深浅主题">
                    <!-- HEADER_SUN_ICON -->
                    <!-- HEADER_MOON_ICON -->
                </button>
            </div>
        </div>
    </div>
    <div id="search-container" data-open="false" class="hidden freecat-header-search items-center">
        <label class="sr-only" for="search-input">搜索文章</label>
        <input type="search" id="search-input" placeholder="搜索文章标题或内容" class="freecat-search-input" />
        <button id="search-close" class="freecat-header-action" type="button" aria-label="Close search" title="关闭搜索">
            <!-- HEADER_CLOSE_ICON -->
        </button>
    </div>
</header>
<div id="search-results-overlay" class="fixed inset-x-0 bottom-0 z-40 overflow-y-auto" data-open="false" data-prebuilt="true"></div>
