<style>
    :root {
        --freecat-canvas: #ffffff;
        --freecat-home-text: #1e293b;
        --freecat-home-muted: #64748b;
        --freecat-home-rule: #dce2ea;
        --freecat-home-accent: #365f88;
        --freecat-home-emphasis: #0f172a;
        --freecat-home-pin-label: #deebf8;
        --freecat-home-sidebar-top: calc(var(--freecat-page-top-offset, 97px) + 2.5rem);
    }

    .dark {
        --freecat-canvas: #101622;
        --freecat-home-text: #e2e8f0;
        --freecat-home-muted: #a4b1c3;
        --freecat-home-rule: #334155;
        --freecat-home-accent: #a4c5e8;
        --freecat-home-emphasis: #f1f5f9;
        --freecat-home-pin-label: #27425f;
    }

    .freecat-home-stage {
        background: var(--freecat-canvas);
        isolation: isolate;
    }

    /* 两侧轨道等宽，使文章独立居中；简介只使用左侧轨道，不挤偏正文。 */
    .freecat-home-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, var(--freecat-home-column-width)) minmax(0, 1fr);
        align-items: start;
        column-gap: 0;
        row-gap: 2rem;
        width: 100%;
        margin-inline: auto;
        padding: var(--freecat-home-sidebar-top) 1.5rem 5rem;
        color: var(--freecat-home-text);
    }

    .freecat-home-sidebar {
        /* 固定在正文左侧；内容整体按可用高度缩放，不分页、不裁切、不设内部滚动。 */
        position: fixed;
        top: var(--freecat-home-sidebar-top);
        left: calc(var(--freecat-side-content-left) - 0.375rem);
        z-index: 20;
        min-width: 0;
        width: min(19rem, calc(50% - var(--freecat-home-column-width) / 2 - var(--freecat-home-sidebar-gap) - 1.5rem));
        padding: 0.375rem;
        overflow: visible;
    }

    .freecat-home-sidebar-content {
        display: flow-root;
        width: 100%;
        transform: scale(var(--freecat-sidebar-scale, 1));
        transform-origin: top left;
    }

    .freecat-home-posts {
        position: relative;
        left: 2rem;
        grid-column: 2;
        grid-row: 1;
    }

    .freecat-home-sidebar-top,
    .freecat-home-posts,
    .freecat-home-posts-inner {
        min-width: 0;
        width: 100%;
    }

    .freecat-home-identity {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }

    .freecat-home-avatar {
        width: 3.5rem;
        height: 3.5rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #f1f5f9 center / cover no-repeat;
    }

    .freecat-sidebar-slogan {
        font-size: 1.5rem;
        line-height: 1.5;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        text-wrap: pretty;
    }

    .freecat-sidebar-description {
        margin-top: 0.75rem;
        font-size: 0.9375rem;
        line-height: 1.75;
        color: var(--freecat-home-muted);
        overflow-wrap: anywhere;
    }

    .freecat-home-about {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        margin-top: 0.5rem;
        font-size: 0.9375rem;
        color: var(--freecat-home-accent);
    }

    .freecat-home-sidebar-recent {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--freecat-home-rule);
    }

    .freecat-home-sidebar-recent:not(:has(a)) {
        display: none;
    }

    .freecat-sidebar-recent-heading {
        font-size: 0.9375rem;
        margin-bottom: 0.75rem;
        color: var(--freecat-home-text);
    }

    .freecat-sidebar-recent-link {
        display: block;
        padding-block: 0.375rem;
        color: var(--freecat-home-muted);
        font-size: 0.9375rem;
        line-height: 1.65;
        overflow-wrap: anywhere;
    }

    .freecat-home-tools { padding-bottom: 1.5rem; }

    .freecat-home-list-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0;
    }

    .freecat-home-list-heading :is(h1, h2) {
        font-size: 1.5rem;
        font-weight: 500;
        line-height: 1.5;
    }

    .freecat-home-count {
        margin-left: 0.375rem;
        color: var(--freecat-home-muted);
        font-size: 0.9375rem;
        font-weight: 400;
    }

    .freecat-home-list-heading a {
        flex-shrink: 0;
        color: var(--freecat-home-muted);
        font-size: 0.9375rem;
    }

    .freecat-home-post-list { border-top: 1px solid var(--freecat-home-rule); }

    .home-post-entry {
        --home-post-padding: 3.75rem;
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.75rem;
        padding-block: var(--home-post-padding);
        border-bottom: 1px solid var(--freecat-home-rule);
        text-decoration: none;
        color: var(--freecat-home-text);
    }

    /* 全部页沿用阅读条目，只通过容器变量将图文切换为上下排版。 */
    .home-post-entry.has-cover { grid-template-columns: var(--home-post-cover-columns, minmax(0, 1fr) 10rem); }
    .home-post-copy { min-width: 0; }

    /* 更新时间与箭头一起换行；动效只在预留空间内发生，不推挤文字。 */
    .home-post-update { display: inline-flex; align-items: center; gap: 0.5rem; }
    .home-post-arrow {
        display: inline-flex;
        flex: 0 0 1rem;
        color: var(--freecat-home-accent);
        opacity: 0;
        transform: translateX(-2px);
        transition: opacity 180ms ease-out, transform 180ms ease-out;
        pointer-events: none;
    }

    .home-post-entry:is(:hover, :focus-visible) .home-post-arrow {
        opacity: 1;
        transform: translateX(0);
    }

    .home-post-meta,
    .home-post-tags {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.375rem 1rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--freecat-home-muted);
    }

    .home-post-pin {
        display: inline-flex;
        padding: 0.125rem 0.5rem;
        border-radius: 4px;
        background: var(--freecat-home-pin-label);
        color: var(--freecat-home-accent);
        font-weight: 500;
    }

    /* 整行保持透明，置顶底色仅属于文字徽标。 */
    .home-post-title {
        font-family: "Freecat Figtree", "Freecat Noto Sans SC", system-ui, sans-serif;
        margin-top: 0.625rem;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -0.015em;
        overflow-wrap: anywhere;
        text-wrap: pretty;
        transition: color 180ms ease-out;
    }

    .home-post-excerpt {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
        overflow-wrap: anywhere;
        margin-top: 0.75rem;
        font-size: 1.0625rem;
        line-height: 1.8;
        color: var(--freecat-home-muted);
    }

    .home-post-tags { margin-top: 1rem; gap: 0.375rem 0.75rem; }

    .home-post-cover {
        align-self: center;
        aspect-ratio: 3 / 2;
        overflow: hidden;
        border-radius: 6px;
    }

    .home-post-entry:is(:hover, :focus-visible) .home-post-title {
        color: var(--freecat-home-emphasis);
    }

    .freecat-home-sidebar a:hover,
    .freecat-home-list-heading a:hover { color: var(--freecat-home-accent); }

    :is(.freecat-home-layout, .freecat-all-page main) :is(a, button):focus-visible {
        outline: 2px solid var(--freecat-home-accent);
        outline-offset: 4px;
        border-radius: 3px;
    }

    .freecat-home-pagination { display: flex; justify-content: center; }
    #view-all-header:empty,
    #view-all-header:not(:has(*)) { display: none; }

    /* 当左侧不足以容纳可读的简介时上下排列，保留全部内容和正常字号。 */
    @media (max-width: 1279px) {
        .freecat-home-layout {
            grid-template-columns: minmax(0, 1fr);
            gap: 2rem;
            max-width: calc(var(--freecat-home-reading-width) + 2.5rem);
            padding: calc(var(--freecat-page-top-offset, 77px) + 1.25rem) 1.25rem 3rem;
        }

        .freecat-home-sidebar,
        .freecat-home-posts {
            grid-column: auto;
            grid-row: auto;
        }

        .freecat-home-posts { left: 0; }
        .freecat-home-sidebar-content { transform: none; }

        .freecat-home-sidebar {
            position: static;
            width: 100%;
            padding: 0 0 1.75rem;
            overflow: visible;
            border-bottom: 1px solid var(--freecat-home-rule);
        }

        .freecat-home-identity { flex-direction: row; align-items: center; gap: 1rem; }
        .freecat-home-avatar { width: 3.5rem; height: 3.5rem; }
        .freecat-sidebar-slogan { font-size: 1.5rem; }
        body:not([data-page="home"]) .freecat-home-sidebar { display: none; }
    }

    @media (max-width: 1023px) {
        .home-post-entry { --home-post-padding: 1.875rem; }
    }

    @media (max-width: 600px) {
        .home-post-entry { --home-post-padding: 1.5rem; gap: 1rem; }
        .home-post-entry.has-cover { grid-template-columns: minmax(0, 1fr); }
        .home-post-title { font-size: 1.25rem; }
        .home-post-excerpt { font-size: 1rem; }
        /* 手机先读完整标题和摘要，封面放在文字之后，避免挤窄阅读宽度。 */
        .home-post-cover { width: 100%; max-height: 10.5rem; aspect-ratio: 16 / 9; }
    }

    @media (prefers-reduced-motion: reduce) {
        .home-post-title,
        .home-post-arrow { transition: none; }
    }
</style>
