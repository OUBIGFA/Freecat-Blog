<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->
    <title>Search - <!-- SITE_TITLE --></title>
    <!-- SEARCH_SEO_HEAD -->
    <!-- INCLUDE:home-layout-style -->
    <style>
        /* Keep search hierarchy and feedback in the article list's existing palette. */
        .freecat-search-title { margin-bottom: 1rem; font-size: 1.5rem; font-weight: 500; line-height: 1.5; }
        #search-query-display { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; color: var(--freecat-home-muted); }
        #search-query-display p { min-width: 0; overflow-wrap: anywhere; line-height: 1.75; }
        #current-query { color: var(--freecat-home-text); font-weight: 500; }
        #no-results { padding-block: 2rem 4rem; }
        #no-results h3 { margin-bottom: 0.75rem; font-size: 1.25rem; font-weight: 500; }
        #no-results p { color: var(--freecat-home-muted); line-height: 1.75; }
        #no-results a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 1rem; color: var(--freecat-home-accent); }
    </style>
</head>

<body data-page="search"
    class="bg-background-light dark:bg-background-dark font-display text-[#1e293b] dark:text-slate-200 transition-colors duration-200">
    <div class="freecat-home-stage relative flex h-auto min-h-screen w-full flex-col">

        <!-- INCLUDE:header -->

        <!-- 主内容区：freecat-home-hero 标记让 main.js 跳过 layout-container 的 margin-top，
             左/右两块各自承担让位顶栏的 padding-top。 -->
        <main data-floating-nav-container aria-labelledby="search-title" class="layout-container page-blur-target freecat-home-hero flex h-full grow flex-col">
            <div class="freecat-home-layout w-full">

                <!-- INCLUDE:home-sidebar -->

                <!-- 右侧搜索结果主体：inner 居中于视口，同时避开左侧 sidebar。 -->
                <section class="freecat-home-posts">
                    <div class="freecat-home-posts-inner w-full">
                        <!-- Go Back 按钮 -->
                        <div
                            class="freecat-list-toolbar flex items-center justify-between gap-4 pb-2 mb-4">
                            <a href="/" data-go-back
                                class="group inline-flex items-center gap-2 h-10 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 transition-colors duration-150">
                                <svg class="text-xl t-btn-arrow-prev"
                                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em"
                                    height="1em">
                                    <path
                                        d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z">
                                    </path>
                                </svg>
                                <span class="freecat-go-back-text text-sm">Back</span>
                            </a>
                            <!-- INCLUDE:update-sort-control -->
                        </div>

                        <!-- 搜索查询显示 -->
                        <h2 id="search-title" class="freecat-search-title">Search</h2>
                        <div id="search-query-display" role="status" aria-live="polite">
                            <p id="search-empty-prompt">
                                点击顶部搜索按钮，查找文章标题或内容。
                            </p>
                            <p id="search-active-query" class="hidden">
                                搜索：<span id="current-query"></span>
                            </p>
                            <span id="results-count" class="freecat-results-count hidden" data-count-ready="false"
                                aria-label="Loading results">
                                <svg class="freecat-results-count-icon" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path
                                        d="M24 12L18.3431 17.6568L16.9289 16.2426L21.1716 12L16.9289 7.75735L18.3431 6.34314L24 12ZM2.82843 12L7.07107 16.2426L5.65685 17.6568L0 12L5.65685 6.34314L7.07107 7.75735L2.82843 12Z">
                                    </path>
                                </svg>
                                <span class="freecat-results-count-value" aria-hidden="true"></span>
                            </span>
                        </div>

                        <!-- === 动态搜索结果注入区 === -->
                        <div id="search-results" class="freecat-home-post-list">
                            <!-- SEARCH_RESULTS_PLACEHOLDER -->
                        </div>
                        <!-- ===================== -->

                        <!-- 无结果提示 (默认隐藏) -->
                        <div id="no-results" class="hidden">
                            <h3>没有找到相关文章</h3>
                            <p>点击顶部搜索按钮，换个关键词再试。</p>
                            <a href="/">返回首页 →</a>
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- INCLUDE:floating-nav -->

        <!-- INCLUDE:footer -->
    </div>

    <!-- INCLUDE:scripts-end -->
</body>

</html>
