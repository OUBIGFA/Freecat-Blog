        <!-- INCLUDE:header -->

        <!-- 主内容区

        <main
            class="layout-container page-blur-target mt-[var(--freecat-page-top-offset)] flex h-full grow flex-col px-8 md:px-20 lg:px-40 pt-3 pb-3 md:pt-4">
            <div class="layout-content-container flex flex-col max-w-[1200px] flex-1 mx-auto w-full">

                <!-- About Hero Section - 居中布局 -->
                <div class="flex flex-col items-center justify-center py-12 md:py-16">

                    <div class="freecat-avatar w-28 h-28 md:w-40 md:h-40 mb-8" role="img" aria-label="博客头像">
                        <span aria-hidden="true">FC</span>
                        <img src="<!-- ABOUT_HERO_AVATAR -->" alt="" width="160" height="160" decoding="async" />

                    <!-- 标题和副标题 - 居中排版 -->
                    <div class="@container flex flex-col items-center text-center gap-6 w-full">
                        <h1
                            class="freecat-about-title text-[#1e293b] dark:text-slate-200 text-3xl @[480px]:text-4xl leading-snug tracking-[-0.02em]">
                            <!-- ABOUT_HERO_TITLE -->
                        </h1>
                        <p
                            class="freecat-about-description text-[#616f89] dark:text-gray-400 text-base md:text-lg leading-relaxed max-w-2xl lg:max-w-3xl">
                            <!-- ABOUT_HERO_SUBTITLE -->

                        <!-- 社交媒体链接 - 克制：小尺寸 + 柔色 + 留白 -->
                        <div
                            class="freecat-about-social flex flex-wrap justify-center items-center gap-3 mt-6">
                            <!-- SOCIAL_LINKS -->
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>
