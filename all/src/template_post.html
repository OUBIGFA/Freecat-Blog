<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <script><!-- THEME_SCRIPT --></script>
    <script><!-- SHELL_BOOTSTRAP_SCRIPT --></script>
    <!-- 显式接管 speculation rules slot，禁用 Chrome NavigationPredictor /
         Cloudflare Speed Brain 的投机性 prerender。
         详细原因见 partials/head-base.html 里的同款注释。 -->
    <script type="speculationrules">{"prefetch":[],"prerender":[]}</script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- 主题色：随系统浅/深色模式切换，影响移动端浏览器地址栏与 PWA 启动画面 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101622" media="(prefers-color-scheme: dark)" />
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
        }

        html.dark,
        html.dark body {
            background: #101622;
        }
    </style>
    <title><!-- TITLE_PLACEHOLDER --> - <!-- SITE_TITLE --></title>
    <!-- POST_SEO_HEAD -->
    <!-- POST_JSONLD -->

    <link rel="icon" href="<!-- SITE_FAVICON -->" />
    <!-- DISCOVERY_LINKS -->

    <!-- POST_KATEX_CSS -->
    <!-- POST_FONT_PRELOADS -->
    <link rel="stylesheet" href="/assets/transitions.css" />
    <link rel="stylesheet" href="/assets/tailwind.css" />
    <link rel="stylesheet" href="/assets/typography.css" />
    <link rel="stylesheet" href="/assets/post.css" />
    <link rel="stylesheet" href="/assets/post-code.css" />
    <!-- POST_HIGHLIGHT_CSS -->
    <!-- POST_MEDIA_CSS -->
    <!-- POST_AUDIO_CSS -->
    <!-- POST_VIDEO_CSS -->
    <style>
        <!-- POST_FONT_FACE_CSS -->
    </style>
</head>

<body
    class="freecat-post-page bg-white dark:bg-background-dark font-display text-[#1e293b] dark:text-slate-200 transition-colors duration-200">
    <div class="relative flex h-auto min-h-screen w-full flex-col">

        <!-- INCLUDE:header -->

        <main class="page-blur-target flex-grow mt-[var(--freecat-page-top-offset)]">
            <div class="freecat-post-layout">
                <!-- 正文独立居中；目录只使用宽屏侧边空白，不挤压阅读栏。 -->
                <div class="relative">
                    <article class="freecat-post-article">
                        <header class="freecat-post-header">
                            <div class="freecat-post-eyebrow">
                                <a href="/" data-go-back class="freecat-post-back freecat-go-back-text">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="1.5" width="18" height="18" aria-hidden="true">
                                        <path d="m14 6-6 6 6 6" />
                                    </svg>
                                    <span>Back</span>
                                </a>
                            </div>
                            <h1 class="post-title"><!-- TITLE_H1_PLACEHOLDER --></h1>
                            <div class="freecat-post-meta">
                                <span>发布于 <time class="freecat-published-date-text" datetime="<!-- DATE_ISO_PLACEHOLDER -->"><!-- DATE_PLACEHOLDER --></time></span>
                                <span>更新于 <span class="freecat-date-text"><!-- MODIFIED_PLACEHOLDER --></span></span>
                                <div class="freecat-post-tags"><!-- TAGS_PLACEHOLDER --></div>
                                <!-- POST_COPY_BUTTON_PLACEHOLDER -->
                            </div>
                        </header>

                        <!-- LATEST_UPDATE_PLACEHOLDER -->

                        <aside class="freecat-post-toc-panel group/toc" aria-label="文章目录">
                            <details class="freecat-post-toc">
                                <summary id="toc-summary" class="freecat-post-toc-title" aria-controls="toc-container">目录
                                    <svg class="freecat-update-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                                </summary>
                                <div class="freecat-post-toc-scroll-shell">
                                    <div id="toc-container">
                                        <nav aria-label="章节"><!-- TOC_PLACEHOLDER --></nav>
                                    </div>
                                </div>
                                <div id="toc-controls" class="freecat-toc-controls" hidden>
                                    <button id="toc-more" type="button" aria-controls="toc-container">展开更多</button>
                                    <button id="toc-collapse" type="button" aria-controls="toc-container">全部收起</button>
                                </div>
                            </details>
                        </aside>

                        <div
                            id="freecat-article-body"
                            class="prose !mt-0 max-w-none">
                            <!-- CONTENT_PLACEHOLDER -->
                        </div>
                        <!-- POST_COPY_SOURCE_PLACEHOLDER -->

                        <footer class="freecat-post-end">
                            <a href="/" data-go-back class="freecat-post-back freecat-go-back-text">← Back</a>
                            <button id="share-btn" type="button" aria-label="分享文章"
                                class="t-btn t-btn-outline-subtle group relative inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full
                                       border text-sm font-medium">
                                <span class="share-btn-icon-wrap relative inline-flex h-4 w-4 items-center justify-center">
                                    <svg class="share-btn-icon share-btn-icon-default absolute inset-0 h-4 w-4"
                                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                        stroke-linejoin="round" aria-hidden="true">
                                        <path d="M12 16V4" />
                                        <path d="M7 9l5-5 5 5" />
                                        <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
                                    </svg>
                                    <svg class="share-btn-icon share-btn-icon-done absolute inset-0 h-4 w-4"
                                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" aria-hidden="true">
                                        <path d="M5 12l5 5L20 7" />
                                    </svg>
                                </span>
                                <span class="share-btn-label text-[15px] font-medium tracking-wide leading-none" aria-live="polite">分享文章</span>
                            </button>
                        </footer>
                    </article>

                </div>
            </div>
        </main>

        <!-- INCLUDE:floating-nav -->

        <!-- INCLUDE:footer -->
    </div>

    <!-- 全站共用脚本清单与加载顺序统一在 partials/scripts-end.html 声明，此处只追加 post 专属脚本。 -->
    <!-- INCLUDE:scripts-end -->
    <!-- POST_CHART_JS -->
    <script src="/assets/code-folding.js" defer></script>
    <script src="/assets/post.js" defer></script>
    <!-- POST_MEDIA_JS -->
    <!-- POST_AUDIO_JS -->
    <!-- POST_VIDEO_JS -->
</body>

</html>
